[package]
name = "corr-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Real-time correlator host side: multicast receive, frame assembly, block scheduling, output"
license = "MIT OR Apache-2.0"
publish = false

[features]
# The readiness-driven receive backend: the `corr-async` binary and `tokio`.
#
# **On by default**: `cargo build --release` builds all three binaries and a fresh
# checkout gets both receive backends without a flag to remember. Build the
# thread-per-station pair alone with `--no-default-features` -- that also keeps
# `tokio` out of the dependency tree entirely, which is what the production host
# wants when it has no use for the second backend.
default = ["async-recv", "status-http"]
async-recv = ["dep:tokio"]
# The read-only status endpoint (`monitoring.http`, `GET /status.json`). On by
# default, but the endpoint itself is **off unless the configuration asks for
# it**: the feature only decides whether the code exists, so
# `--no-default-features` keeps HTTP and JSON out of a production build
# entirely, exactly like `async-recv` keeps tokio out.
status-http = ["dep:serde_json"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
# Only with `status-http`: the serialisation half of the status endpoint. The
# snapshot type itself is plain `serde`-derivable data in `monitor.rs`, so the
# sampler does not depend on this.
serde_json = { version = "1", optional = true }
# Only with `async-recv` (on unless `--no-default-features`): the per-worker runtimes that multiplex the
# stations' sockets (`rt`), the `select!` that waits on a socket and on the
# scheduler's request at once (`macros`), the epoll reactor with `AsyncFd` (`net`),
# and the tick that bounds how long a silent station may ignore a request (`time`).
tokio = { version = "1", features = ["rt", "macros", "net", "time"], optional = true }

[build-dependencies]
cmake = "0.1"

# All three binaries live in `src/bin/`: the thread-per-station correlator, the
# readiness-driven one (`--features async-recv`, on by default) and the front-end
# replayer. None of them needs a `src/main.rs`.
[[bin]]
name = "corr"
path = "src/bin/corr.rs"

[[bin]]
name = "corr-replay"
path = "src/bin/replay.rs"

# Not built without the feature, so `cargo build --release` is unchanged.
[[bin]]
name = "corr-async"
path = "src/bin/corr_async.rs"
required-features = ["async-recv"]

[profile.release]
# The receive path is a busy-poll loop that must never be deoptimised into
# something slower than the kernel's own copy; keep overflow checks off and let
# LTO see across the crate, but keep debug assertions separate so that a debug
# build can still trip the layout invariants.
lto = "thin"
codegen-units = 1
panic = "abort"
debug = 1

[profile.dev]
opt-level = 1
